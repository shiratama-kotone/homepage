
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUNITHM 単曲レート計算機</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="single-track">
            <h1>CHUNITHM 単曲レート計算機</h1>

            <div class="field">
                <label for="constant">譜面定数</label>
                <input id="constant" type="number" min="5.01" max="20" step="0.01" placeholder="例：15.0">
            </div>

            <div class="field">
                <label for="score">スコア</label>
                <input id="score" type="number" min="0" max="1010000" placeholder="例：1009000">
            </div>

            <section class="result" aria-live="polite">
                <div>単曲レート</div>
                <output class="result-value" id="rating">---</output>
                <div class="result-detail" id="rank">譜面定数とスコアを入力</div>
            </section>

            <p class="hint">
                ボーダー間は直線補間で計算。
                500,000点以下は0、
                1,009,000点以上は譜面定数＋2.15で固定。
            </p>

            <button type="button" id="reset">入力をクリア</button>
        </div>
    </main>

    <div id="footer"></div>

    <script src="/script/chunithm/single-track.js"></script>
    <script src="/script/script.js"></script>
</body>
</html>
