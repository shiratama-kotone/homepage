
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUNITHM 単曲レート計算機</title>
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="content">
        <h1>CHUNITHM 単曲レート計算機</h1>

        <form id="calculator">
            <div>
                <label for="constant">譜面定数</label>
                <input
                    type="number"
                    id="constant"
                    min="1"
                    max="20"
                    step="0.1"
                    placeholder="例：16.0"
                    required
                >
            </div>

            <div>
                <label for="score">スコア</label>
                <input
                    type="number"
                    id="score"
                    min="0"
                    max="1010000"
                    step="1"
                    placeholder="例：1010000"
                    required
                >
            </div>

            <div>
                <button type="submit">計算する</button>
                <button type="reset">クリア</button>
            </div>
        </form>

        <section class="card">
            <h2>計算結果</h2>
            <output id="rating">---</output>
            <p id="rank" class="description">
                譜面定数とスコアを入力してね
            </p>
        </section>

        <p class="description">
            500,000点以下は0。
            1,009,000点以上は譜面定数＋2.15で固定。
            ボーダー間は直線補間で計算。
        </p>
    </main>

    <div id="footer"></div>

    <script src="/script/tools/chunithm/single-track.js"></script>
    <script src="/script/script.js"></script>
</body>
</html>
