<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIDI Player</title>

<link rel="stylesheet" href="/style/style.css">
<link rel="stylesheet" href="/style/tools.css">

<link
    rel="icon"
    href="https://shiratama-kotone.wikidot.com/local--favicon/favicon.gif?86564"
>

<!-- ピアノロール用CSS -->
<style>
/* MIDIプレイヤー全体 */
.midi-player {
    width: 100%;
    max-width: 87.5rem;
    min-width: 0;
    margin: 0 auto;
    box-sizing: border-box;
}

/* ファイル選択 */
.midi-upload {
    display: block;
    width: 100%;
    padding: clamp(1rem, 4vw, 2rem);
    box-sizing: border-box;
    border: 2px dashed var(--link);
    border-radius: .75rem;
    text-align: center;
    cursor: pointer;
}

.midi-upload input {
    display: none;
}

/* ボタン */
.midi-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: .625rem;
    margin-top: 1rem;
}

.midi-buttons button,
.midi-buttons a {
    max-width: 100%;
    box-sizing: border-box;
}

/* シークバー */
.midi-seek {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-width: 0;
    margin-top: 1rem;
}

.midi-seek input {
    width: 100%;
    min-width: 0;
}

/* ズーム・速度 */
.midi-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem 1.5rem;
    margin: 1rem 0;
}

.midi-toolbar label {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem;
    min-width: 0;
}

.midi-toolbar input {
    max-width: 100%;
}

/* ピアノロール */
#midi-roll-container {
    position: relative;
    display: flex;
    align-items: flex-start;
    width: 100%;
    height: clamp(18rem, 65vh, 45rem);
    min-height: 18rem;
    max-height: 45rem;
    box-sizing: border-box;

    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;

    border: 1px solid var(--border);
    border-radius: .5rem;
    background: var(--card);
    isolation: isolate;
}

/* 左側の鍵盤 */
#midi-piano-keys {
    position: sticky;
    top: 0;
    left: 0;
    align-self: flex-start;
    flex: 0 0 80px;

    width: 80px;
    max-width: none;
    height: 1280px;

    z-index: 3;
    display: block;
    background: #333;
}

/* ノート表示領域 */
#midi-roll-track {
    position: relative;
    flex: 0 0 auto;

    width: 2000px;
    height: 1280px;
}

/* ノート */
#midi-piano-roll {
    position: absolute;
    top: 0;
    left: 80px;

    z-index: 1;
    display: block;

    max-width: none;
    width: 2000px;
    height: 1280px;
}

/* MIDI情報テーブル */
.midi-info {
    width: 100%;
    max-width: 100%;
    table-layout: fixed;
    overflow-wrap: anywhere;
    box-sizing: border-box;
}

/* 狭い画面 */
@media (max-width: 48rem) {
    .midi-buttons {
        gap: .5rem;
    }

    .midi-buttons button,
    .midi-buttons a {
        flex: 1 1 auto;
    }

    .midi-toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: .75rem;
    }

    .midi-toolbar label {
        justify-content: space-between;
    }

    .midi-toolbar input {
        flex: 1;
        min-width: 0;
    }

    #midi-roll-container {
        height: 55vh;
        min-height: 16rem;
    }
}

/* さらに狭い画面 */
@media (max-width: 25rem) {
    .midi-seek {
        gap: .35rem;
        font-size: .85rem;
    }

    .midi-upload {
        padding: 1rem;
    }

    #midi-roll-container {
        height: 50vh;
        min-height: 14rem;
    }
}
</style>

<!-- Tone.js -->
<script src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>

<!-- MIDI.js -->
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2/build/Midi.min.js"></script>

<!-- lamejs -->
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XGM94MF3RY"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag() {
    dataLayer.push(arguments);
}

gtag('js', new Date());
gtag('config', 'G-XGM94MF3RY');
</script>

</head>

<body>

<div id="header"></div>

<div class="content">

<div class="midi-player">

<h1>MIDI Player</h1>

<!-- MIDIファイル選択 -->

<label class="midi-upload">

<input
    type="file"
    id="midi-file"
    accept=".mid,.midi,audio/midi"
>

<span>MIDIファイルを選択</span>

</label>

<!-- 再生ボタン -->

<div class="midi-buttons">

<button
    id="midi-play"
    type="button"
    disabled
>
▶ 再生
</button>

<button
    id="midi-pause"
    type="button"
    disabled
>
⏸ 一時停止
</button>

<button
    id="midi-stop"
    type="button"
    disabled
>
■ 停止
</button>

</div>

<!-- シークバー -->

<div class="midi-seek">

<span id="midi-current-time">0:00</span>

<input
    type="range"
    id="midi-seek-bar"
    min="0"
    max="100"
    value="0"
    step="0.01"
>

<span id="midi-total-time">0:00</span>

</div>

<!-- ツールバー -->

<div class="midi-toolbar">

<label>
ズーム

<input
    type="range"
    id="midi-zoom"
    min="0.5"
    max="5"
    step="0.1"
    value="1"
>
</label>

<label>
速度

<input
    type="range"
    id="midi-speed"
    min="0.5"
    max="2"
    step="0.05"
    value="1"
>
</label>

</div>

<!-- ピアノロール -->

<div id="midi-roll-container">

<canvas id="midi-piano-keys"></canvas>

<div id="midi-roll-track">

<canvas id="midi-piano-roll"></canvas>

</div>

</div>

<!-- MP3変換 -->

<div class="midi-buttons">

<button
    id="midi-convert"
    type="button"
    disabled
>
MP3へ変換
</button>

<a
    id="midi-download"
    download="music.mp3"
    style="display:none;"
>
MP3をダウンロード
</a>

</div>

<div id="midi-progress"></div>

<!-- MIDI情報 -->

<table class="midi-info">

<tbody>

<tr>
<th>曲名</th>
<td id="midi-title">-</td>
</tr>

<tr>
<th>テンポ</th>
<td id="midi-tempo">-</td>
</tr>

<tr>
<th>拍子</th>
<td id="midi-time-signature">-</td>
</tr>

<tr>
<th>長さ</th>
<td id="midi-length">-</td>
</tr>

<tr>
<th>トラック数</th>
<td id="midi-track-count">-</td>
</tr>

<tr>
<th>ノート数</th>
<td id="midi-note-count">-</td>
</tr>

</tbody>

</table>

</div>

</div>

<div id="footer"></div>

<!-- 共通スクリプト -->
<script src="/script/script.js"></script>

<!-- MIDI Player -->
<script src="/script/tools/midi-play.js"></script>

</body>
</html>
