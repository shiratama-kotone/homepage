<body>

<div id="header"></div>

<div class="content">

<div class="wiki-hero">
<h1>ゆゆゆWiki</h1>
<p>いろいろ情報をまとめたWikiです。</p>

<form id="wiki-search">
  <input
    type="text"
    id="searchInput"
    placeholder="ページ名・説明・タグを検索"
  >
  <button type="submit">検索</button>
</form>
</div>

<section>
<h2>お知らせ</h2>
<ul>
<li>現在、お知らせはありません。</li>
</ul>
</section>

<section>
<h2>最近更新されたページ</h2>
<ul>
<li><a href="/wiki/character/yuyuyu.html">ゆゆゆ</a></li>
<li><a href="/wiki/game/ac/music/chunithm">CHUNITHM</a></li>

</ul>
</section>

<section>
<h2>カテゴリ</h2>
<ul>

<ul>

</ul>
</section>

<section>
<h2>Wiki情報</h2>
<ul>
<li>総ページ数: <span id="page-count">読み込み中...</span></li>
<li>最終更新: 2026/09/09</li>
</ul>
</section>

</div>

<div id="footer"></div>

<script src="/script/script.js"></script>
<script>
  // 総ページ数を取得
  fetch("/wiki/pages.json")
    .then(function(res) {
      return res.json();
    })
    .then(function(pages) {
      document.getElementById("page-count").textContent = pages.length;
    })
    .catch(function() {
      document.getElementById("page-count").textContent = "取得失敗";
    });


  // Wiki検索
  document.getElementById("wiki-search")?.addEventListener("submit", function(e) {
    e.preventDefault();

    var q = document.getElementById("searchInput").value.trim();

    if (!q) return;

    location.href =
      "/wiki/search.html?q=" +
      encodeURIComponent(q);
  });
</script>
</body>
</html>
