<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お問い合わせ</title>

<link rel="stylesheet" href="/style/style.css">
<link rel="icon" href="https://shiratama-kotone.wikidot.com/local--favicon/favicon.gif?86564">
</head>

<body>

<div id="header"></div>

<div class="content">

<h1>問い合わせ</h1>

<p>
意見・要望・不具合報告とかはここから送信できるよ<br>
返信が必要なときはメアドを書いてね
</p>

<form name="contact" method="POST" netlify>

<input type="hidden" name="form-name" value="contact">

<label for="name">名前</label>
<input
type="text"
id="name"
name="name"
placeholder="名前"
required
>

<label for="email">メアド</label>
<input
type="email"
id="email"
name="email"
placeholder="返信が必要なときだけ書こう"
>

<label for="category">問い合わせ種別</label>
<select id="category" name="category">
<option>意見・感想</option>
<option>不具合報告</option>
<option>要望</option>
<option>削除依頼</option>
<option>その他</option>
</select>

<label for="message">内容</label>
<textarea
id="message"
name="message"
rows="7"
placeholder="内容をここに書いてね。"
required
></textarea>

<button type="submit">
送信
</button>

</form>

<a href="mailto:shiratama_kotone@outlook.com">メールで直接でもいいよ</a>
</div>

<div id="footer"></div>

<script src="/script/script.js"></script>

</body>
</html>
