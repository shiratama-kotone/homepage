[[redirects]]
  from = "/style/*"
  to = "/style/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/script/*"
  to = "/script/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# 503かえすやつ
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 503
  force = true
