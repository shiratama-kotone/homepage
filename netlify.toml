[[redirects]]
  from = "/style/*"
  to = "/style/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/script/*"
  to = "/script/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

 # 合言葉ページだすやつ
[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200
  force = true

# くっきー持ってるやつは通す
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true
  conditions = {Cookie = ["admin_mode"]}

# 503かえすやつ
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 503
  force = true
